spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  datasource:
    url: jdbc:h2:mem:typed_model_runtime;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  liquibase:
    enabled: false

logging:
  level:
    com.*: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
